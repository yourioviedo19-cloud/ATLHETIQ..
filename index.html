<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101317"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ATHLETIQ"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>ATHLETIQ · Performance</title><style>
:root{--bg:#090c0f;--surface:#151b20;--surface2:#1b2328;--line:#283238;--lime:#c9ff46;--text:#f6f8f7;--muted:#96a4a9;color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;background:var(--bg);color:var(--text)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 90% 330px at 60% -70px,#1a2b1d 0%,transparent 85%),var(--bg);padding:env(safe-area-inset-top) 0 calc(100px + env(safe-area-inset-bottom));min-height:100dvh}main{max-width:650px;margin:auto;padding:26px 18px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:32px;line-height:1.12;letter-spacing:-1.25px;margin:11px 0 9px;font-weight:800}h2{font-size:21px;letter-spacing:-.5px;margin:27px 0 13px}h3{font-size:15px;letter-spacing:-.25px;margin:0 0 11px;font-weight:650}.muted{color:var(--muted)}.small{font-size:12px}.brand{font-size:13px;color:var(--lime);font-weight:900;letter-spacing:3px}.card{background:linear-gradient(145deg,#1a2227,#13191d);border:1px solid #2c373c;border-radius:22px;padding:19px;margin:12px 0;box-shadow:0 12px 26px #0002}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.grid .card{margin:0;min-width:0}.metric{font-size:30px;line-height:1.2;letter-spacing:-1px;font-weight:800;margin:10px 0 4px}.accent{color:var(--lime)}button{border:0;border-radius:14px;background:var(--lime);color:#101711;padding:13px 17px;font-weight:800;font-size:14px;cursor:pointer;min-height:43px}button.secondary{background:#293338;color:#f4f6f6}button.danger{background:#4c252b;color:#ffbcbc}input,select,textarea{width:100%;background:#0d1317;color:#fff;border:1px solid #354349;border-radius:13px;padding:13px;font:inherit;margin:7px 0 15px}label{font-size:13px;color:#d3ddde}input:focus,select:focus{border-color:var(--lime);outline:1px solid var(--lime)}.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;align-items:center;background:#11171af7;border-top:1px solid #2b3438;padding:11px 4px calc(12px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}.tabs{overflow-x:auto;scrollbar-width:none}.tabs button{min-width:47px;min-height:43px;background:transparent;color:#8d9a9f;padding:4px 1px;font-size:10px;font-weight:650;display:flex;flex-direction:column;gap:5px;align-items:center;justify-content:center;flex:1;min-width:0}.tabs button.active{color:var(--lime)}.tabs svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}.bar{height:7px;background:#344047;border-radius:10px;overflow:hidden}.bar>div{height:100%;background:linear-gradient(90deg,#8eea4c,var(--lime));border-radius:10px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.entry{border-top:1px solid #2b353b;padding:14px 0}.entry:first-child{border:0}.pill{display:inline-block;background:#29382d;color:var(--lime);border-radius:24px;padding:7px 11px;font-size:12px;font-weight:650}.notice{background:#1c2b21;border:1px solid #304e35;border-radius:16px;padding:14px;color:#cdeabf;font-size:13px}.empty{color:#89979e;font-size:14px;padding:16px 0}details{margin-top:12px;border-bottom:1px solid #2b353b;padding:0 0 12px}summary{color:var(--lime);cursor:pointer;padding:5px 0}svg{max-width:100%}button:focus-visible{outline:2px solid white}.hero{background:linear-gradient(135deg,#1b2d23,#17221d 55%,#172026);border:1px solid #354b37;border-radius:27px;padding:22px;margin:19px 0;position:relative;overflow:hidden}.hero:after{content:'';position:absolute;right:-95px;top:-110px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#c9ff4620,transparent 68%);pointer-events:none}.hero-label{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;color:#b2c6b5;font-weight:800}.hero-grid{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:15px}.ring{--pct:0;position:relative;display:grid;place-items:center;flex-shrink:0;width:135px;height:135px;border-radius:50%;background:conic-gradient(var(--lime) calc(var(--pct)*1%),#36443d 0);box-shadow:0 0 38px #c9ff4610}.ring:before{content:'';position:absolute;inset:12px;border-radius:50%;background:#19251f}.ring-inner{position:relative;text-align:center}.ring-inner strong{display:block;font-size:34px;line-height:1;letter-spacing:-1px}.ring-inner small{font-size:11px;color:#a9b9ae}.hero-info{flex:1;min-width:0}.hero-info strong{display:block;font-size:23px;letter-spacing:-.6px}.hero-info p{font-size:12px;color:#a8bcb0;line-height:1.5}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:25px 0 10px}.section-heading h2{margin:0}.mini-label{font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:#a6b2b5;font-weight:700}.stat-number{font-size:29px;letter-spacing:-1px;font-weight:800;margin:10px 0 7px}.stat-number small{font-size:13px;color:#a4b0b4;font-weight:500;letter-spacing:0}.stat-icon{display:inline-flex;border-radius:12px;background:#28372d;color:var(--lime);padding:8px;font-size:17px}.stat-card{min-height:150px}.progress-track{height:6px;border-radius:10px;background:#344047;overflow:hidden;margin-top:11px}.progress-fill{height:100%;background:var(--lime);border-radius:10px}.action-card{display:flex;align-items:center;gap:13px}.action-dot{width:43px;height:43px;border-radius:14px;display:grid;place-items:center;background:#30402e;color:var(--lime);font-size:21px;flex-shrink:0}.action-card button{font-size:12px;padding:10px 13px;min-height:35px}.welcome{font-size:12px;color:#a3b2b4;margin-top:8px}.topline{display:flex;align-items:center;justify-content:space-between}.avatar{width:39px;height:39px;border-radius:13px;background:#25332a;border:1px solid #46653d;display:grid;place-items:center;color:var(--lime);font-weight:800}.week-entry{display:flex;gap:13px;align-items:center;border-top:1px solid #2a3539;padding:13px 0}.week-entry:first-child{border:0}.day-box{width:43px;height:43px;border-radius:12px;background:#26342b;color:var(--lime);display:grid;place-items:center;font-size:12px;font-weight:800;flex-shrink:0}.week-entry strong{font-size:14px}.week-entry small{display:block;color:#9eabad;margin-top:4px}.week-entry .arrow{margin-left:auto;color:#73858b}.v2-footer{font-size:11px;text-align:center;color:#6f8084;margin:20px 0}@media(max-width:350px){.ring{width:110px;height:110px}.hero-info strong{font-size:19px}.metric,.stat-number{font-size:24px}.card{padding:15px}main{padding:22px 13px}}
</style></head><body><main id="app"></main><nav class="tabs" id="tabs"></nav><script>
const KEY='athletiq-v1';const initial={profile:{weight:81.5,target:77,height:186,calories:2400,protein:160,water:2500},workouts:[],meals:[],sleep:[],weights:[],water:[],activities:[]};let state;try{state={...structuredClone(initial),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(initial)}state.community=state.community||{nickname:'',friends:[],challenges:[]};let tab='home';const today=()=>new Date().toLocaleDateString('en-CA');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render()};const sum=(arr,key,date=today())=>arr.filter(x=>x.date===date).reduce((a,x)=>a+(Number(x[key])||0),0);const fmt=n=>Number(n||0).toLocaleString('fr-FR',{maximumFractionDigits:1});const plans=[['Lundi — Jambes','Presse à cuisses','Leg curl','Leg extension','Mollets','Gainage'],['Mardi — Haut du corps','Développé couché','Tirage vertical','Développé épaules','Rowing','Curl biceps'],['Jeudi — Haut du corps','Développé incliné','Tractions ou tirage','Élévations latérales','Extension triceps','Abdominaux'],['Vendredi — Haut du corps léger','Rowing poulie','Écartés poulie','Face pull','Curl marteau','Gainage']];const card=(title,body)=>`<section class="card"><h3>${title}</h3>${body}</section>`;const list=(arr,fields)=>arr.length?arr.slice().reverse().slice(0,25).map(x=>`<div class="entry"><div class="row"><strong>${esc(x.name||x.type||x.date)}</strong><span class="muted small">${esc(x.date)}</span></div><div class="small muted">${fields(x)}</div></div>`).join(''):'<div class="empty">Aucune donnée enregistrée.</div>';const field=(label,name,type='number',extra='')=>`<label>${label}<input name="${name}" type="${type}" ${extra} required></label>`;function form(kind,fields,button='Enregistrer'){return `<form data-kind="${kind}">${fields}<button type="submit">${button}</button></form>`}function home(){let c=sum(state.meals,'calories'),p=sum(state.meals,'protein'),w=sum(state.water,'ml'),latest=state.weights.at(-1)?.kg??state.profile.weight,s=state.sleep.at(-1),day=new Date().getDay(),dayPlan={1:0,2:1,4:2,5:3}[day],plan=dayPlan===undefined?null:plans[dayPlan],calTarget=Number(state.profile.calories)||1,proteinTarget=Number(state.profile.protein)||1,waterTarget=Number(state.profile.water)||1,completed=state.workouts.filter(x=>x.date===today()).length;return `<div class="topline"><div class="brand">ATHLETIQ<span style="color:#fff">.</span></div><div class="avatar">A</div></div><div class="welcome">${new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</div><h1>Ta journée,<br><span class="accent">ton évolution.</span></h1><div class="hero"><div class="hero-label">Vue d'ensemble · Aujourd'hui</div><div class="hero-grid"><div class="ring" style="--pct:${Math.min(100,Math.round(c/calTarget*100))}"><div class="ring-inner"><strong>${Math.min(100,Math.round(c/calTarget*100))}%</strong><small>nutrition</small></div></div><div class="hero-info"><span class="mini-label">Calories consommées</span><strong>${fmt(c)} <span style="font-size:13px;color:#a6b6ac">kcal</span></strong><p>${fmt(Math.max(0,calTarget-c))} kcal restantes sur ton objectif journalier. Ce cercle suit la nutrition, pas un score de santé.</p></div></div></div><div class="section-heading"><h2>Ton suivi</h2><span class="mini-label">Aujourd'hui</span></div><div class="grid">${`<section class="card stat-card"><span class="stat-icon">◈</span><div class="stat-number">${fmt(p)} <small>g</small></div><div class="mini-label">Protéines · ${fmt(proteinTarget)} g</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,p/proteinTarget*100)}%"></div></div></section>`}${`<section class="card stat-card"><span class="stat-icon">◉</span><div class="stat-number">${fmt(w/1000)} <small>L</small></div><div class="mini-label">Eau · ${fmt(waterTarget/1000)} L</div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,w/waterTarget*100)}%"></div></div></section>`}${`<section class="card stat-card"><span class="stat-icon">↘</span><div class="stat-number">${fmt(latest)} <small>kg</small></div><div class="mini-label">Poids · Cible ${fmt(state.profile.target)} kg</div></section>`}${`<section class="card stat-card"><span class="stat-icon">☾</span><div class="stat-number">${s?fmt(s.hours):'—'} <small>${s?'h':''}</small></div><div class="mini-label">Dernier sommeil</div><div class="small muted" style="margin-top:8px">${s?'Qualité '+esc(s.quality)+'/10':'Aucune nuit saisie'}</div></section>`}</div><div class="section-heading"><h2>À ton programme</h2><span class="mini-label">Plan 4 jours</span></div><section class="card action-card"><div class="action-dot">✦</div><div style="flex:1;min-width:0"><strong>${plan?esc(plan[0].split(' — ')[1]):'Récupération & mobilité'}</strong><div class="small muted" style="margin-top:5px">${plan?esc(plan.slice(1,4).join(' · ')):'Profite de ta journée sans séance programmée'}</div></div><button onclick="go('sport')">Voir</button></section><div class="section-heading"><h2>Cette semaine</h2><span class="mini-label">${state.workouts.length} séances au total</span></div><section class="card">${plans.map(x=>`<div class="week-entry"><div class="day-box">${esc(x[0].split(' — ')[0].slice(0,3).toUpperCase())}</div><div><strong>${esc(x[0].split(' — ')[1])}</strong><small>${esc(x.slice(1,3).join(' · '))}</small></div><span class="arrow">›</span></div>`).join('')}<div class="small muted" style="padding-top:12px">Football mercredi et vendredi soir · Planning indicatif</div></section><div class="notice">Tes données V1 sont conservées sur cette installation. Pense à exporter une sauvegarde dans Profil avant chaque mise à jour.</div><div class="v2-footer">ATHLETIQ COMMUNITY · TRAIN. TRACK. EVOLVE.</div>`}function sport(){return `<div class="brand">ATHLETIQ</div><h1>Sport</h1>${card('Nouvelle séance',form('workout',field('Nom de la séance','name','text','placeholder="Upper body"')+field('Durée (minutes)','minutes','number','min="1"')+field('Exercice principal','exercise','text')+field('Séries','sets','number','min="1"')+field('Répétitions','reps','number','min="1"')+field('Charge (kg)','kg','number','min="0" step="0.5"')))}${card('Activité cardio / football',form('activity',`<label>Type<select name="type"><option>Running</option><option>Football</option><option>Vélo</option><option>Marche</option><option>Autre</option></select></label>`+field('Durée (minutes)','minutes','number','min="1"')+field('Distance (km, 0 si non applicable)','km','number','min="0" step="0.01"')+field('Intensité ressentie /10','rpe','number','min="1" max="10"')))}${card('Programme 4 jours',plans.map(x=>`<details><summary>${esc(x[0])}</summary><p class="small muted">${x.slice(1).map(esc).join(' · ')}</p></details>`).join(''))}${card('Historique musculation',list(state.workouts,x=>`${esc(x.exercise)} · ${x.sets} × ${x.reps} · ${x.kg} kg · ${x.minutes} min`))}${card('Historique activités',list(state.activities,x=>`${x.minutes} min · ${x.km} km · RPE ${x.rpe}/10`))}`}
function nutrition(){let c=sum(state.meals,'calories'),p=sum(state.meals,'protein');return `<div class="brand">ATHLETIQ</div><h1>Nutrition</h1><div class="grid">${card('Calories',`<div class="metric">${fmt(c)}</div><div class="small muted">sur ${state.profile.calories} kcal</div>`)}${card('Protéines',`<div class="metric">${fmt(p)} g</div><div class="small muted">sur ${state.profile.protein} g</div>`)}</div>${card('Ajouter un repas',form('meal',field('Aliment / repas','name','text')+field('Calories (kcal)','calories','number','min="0"')+field('Protéines (g)','protein','number','min="0" step="0.1"')+field('Glucides (g)','carbs','number','min="0" step="0.1"')+field('Lipides (g)','fat','number','min="0" step="0.1"')))}${card('Ajouter de l’eau',`<div class="row"><button onclick="addWater(250)">+ 250 ml</button><button onclick="addWater(500)">+ 500 ml</button></div><p class="muted small">Aujourd’hui : ${sum(state.water,'ml')} / ${state.profile.water} ml</p>`)}${card('Repas récents',list(state.meals,x=>`${x.calories} kcal · P ${x.protein} g · G ${x.carbs} g · L ${x.fat} g`))}`}
function health(){return `<div class="brand">ATHLETIQ</div><h1>Santé & sommeil</h1>${card('Enregistrer une nuit',form('sleep',field('Date du réveil','date','date',`value="${today()}"`)+field('Sommeil (heures)','hours','number','min="0" max="24" step="0.1"')+field('Qualité ressentie /10','quality','number','min="1" max="10"')+field('Fatigue /10','fatigue','number','min="1" max="10"')))}${card('Enregistrer le poids',form('weight',field('Poids (kg)','kg','number','min="20" max="400" step="0.1"')))}${card('Historique du sommeil',list(state.sleep,x=>`${x.hours} h · Qualité ${x.quality}/10 · Fatigue ${x.fatigue}/10`))}${card('Historique du poids',list(state.weights,x=>`${x.kg} kg`))}<p class="muted small">Ces données sont déclaratives. Aucun score médical ni phase de sommeil n'est inventé.</p>`}
function progress(){const total=state.workouts.reduce((a,x)=>a+x.sets*x.reps*x.kg,0),km=state.activities.reduce((a,x)=>a+Number(x.km),0);return `<div class="brand">ATHLETIQ</div><h1>Progression</h1><div class="grid">${card('Séances',`<div class="metric">${state.workouts.length}</div>`)}${card('Distance',`<div class="metric">${fmt(km)} km</div>`)}${card('Volume soulevé',`<div class="metric">${fmt(total)} kg</div>`)}${card('Nuits suivies',`<div class="metric">${state.sleep.length}</div>`)}</div>${card('Évolution du poids',chart(state.weights.map(x=>Number(x.kg)))+`<p class="small muted">${state.weights.length} mesures enregistrées</p>`)}${card('Calories — 7 derniers jours',chart(Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-6+i);return sum(state.meals,'calories',d.toLocaleDateString('en-CA'))})))}${card('Journal récent',list([...state.workouts.map(x=>({...x,type:'Musculation'})),...state.activities].sort((a,b)=>a.date.localeCompare(b.date)),x=>`${x.minutes} min`))}`}
function chart(vals){if(!vals.length)return '<div class="empty">Ajoute des données pour voir ton graphique.</div>';let min=Math.min(...vals),max=Math.max(...vals),r=max-min||1,pts=vals.map((v,i)=>`${15+(i/Math.max(1,vals.length-1))*290},${115-((v-min)/r)*90}`).join(' ');return `<svg viewBox="0 0 320 140" role="img" aria-label="Graphique de progression"><path d="M15 115H305" stroke="#465158"/><polyline points="${pts}" fill="none" stroke="#c9ff46" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${vals.map((v,i)=>`<circle cx="${15+(i/Math.max(1,vals.length-1))*290}" cy="${115-((v-min)/r)*90}" r="3" fill="#c9ff46"/>`).join('')}</svg>`}
function profile(){let p=state.profile;return `<div class="brand">ATHLETIQ</div><h1>Profil & données</h1>${card('Mes objectifs',form('profile',field('Poids de référence (kg)','weight','number',`step="0.1" value="${p.weight}"`)+field('Poids cible (kg)','target','number',`step="0.1" value="${p.target}"`)+field('Taille (cm)','height','number',`value="${p.height}"`)+field('Objectif calories / jour','calories','number',`min="1" value="${p.calories}"`)+field('Objectif protéines (g)','protein','number',`min="1" value="${p.protein}"`)+field('Objectif eau (ml)','water','number',`min="1" value="${p.water}"`),'Sauvegarder les objectifs'))}${card('Sauvegarde',`<p class="small muted">Export JSON : conserve une copie de tes données. Import : restaure une sauvegarde ATHLETIQ.</p><button onclick="exportData()">Exporter mes données</button><label style="display:block;margin-top:15px">Importer une sauvegarde<input type="file" accept="application/json,.json" id="restore"></label>`)}${card('Confidentialité',`<p class="small muted">Aucun compte ni serveur pour tes données personnelles. Le partage du bilan est volontaire. Les informations restent dans le stockage de cette installation. Une suppression des données du navigateur peut les effacer.</p><button class="danger" onclick="resetData()">Effacer toutes mes données</button>`)}`}
const icons={community:'<circle cx="8" cy="8" r="3"/><path d="M2 20v-2a6 6 0 0 1 12 0v2M16 5a3 3 0 0 1 0 6M17 14a5 5 0 0 1 5 5v1"/>',home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',sport:'<path d="M6 5v14M18 5v14M3 8v8M21 8v8M6 12h12"/>',nutrition:'<path d="M4 3v8a4 4 0 0 0 8 0V3M8 3v18M17 3v18M17 3c5 3 5 9 0 11"/>',health:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/>',progress:'<path d="M4 20V12M10 20V7M16 20v-4M22 20V3"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 3-8 8-8s8 3 8 8"/>'};function community(){const c=state.community||{nickname:'',friends:[],challenges:[]};const nick=esc(c.nickname||'Athlète');return `<div class="brand">ATHLETIQ</div><h1>Communauté<span class="accent">.</span></h1><div class="notice">Version privée : tes amis ne sont pas synchronisés automatiquement. Les défis sont enregistrés sur cet appareil. Partage uniquement les informations que tu choisis.</div><section class="hero"><div class="hero-label">Mon profil sportif</div><h2 style="margin:10px 0">${nick}</h2><div class="small muted">${state.workouts.length} séances · ${fmt(state.activities.reduce((a,x)=>a+(Number(x.km)||0),0))} km enregistrés</div><div class="row" style="margin-top:16px"><button onclick="shareApp()">Partager ATHLETIQ</button><button class="secondary" onclick="shareSummary()">Partager mon bilan</button></div></section>${card('Mon pseudo',form('nickname',field('Pseudo public','nickname','text',`maxlength="32" value="${esc(c.nickname||'')}"`),'Enregistrer'))}${card('Mes amis',form('friend',field('Nom de mon ami','name','text','maxlength="50" placeholder="Ex. : Karim"'),'Ajouter un ami')+list(c.friends,x=>'Ajouté sur cet appareil'))}${card('Défis personnels et entre amis',form('challenge',field('Nom du défi','name','text','maxlength="80" placeholder="Ex. : 12 séances ce mois"')+field('Objectif chiffré','target','number','min="1"'),'Créer le défi')+(c.challenges.length?c.challenges.map(x=>`<div class="entry"><div class="row"><strong>${esc(x.name)}</strong><span class="pill">${Number(x.progress)||0} / ${Number(x.target)||1}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,100*(Number(x.progress)||0)/(Number(x.target)||1))}%"></div></div><div class="row" style="margin-top:12px"><button class="secondary" onclick="challengeStep(${Number(x.id)},1)">+1 progression</button><button class="secondary" onclick="challengeStep(${Number(x.id)},-1)">−1</button></div></div>`).join(''):'<div class="empty">Aucun défi créé.</div>'))}${card('Comment inviter mes proches ?',`<p class="small muted">Envoie le lien ATHLETIQ à tes amis. Chacun installe l’app sur son iPhone et suit ses propres données. Les classements en temps réel et les invitations avec compte nécessitent un serveur et une connexion sécurisée, prévus pour une future version.</p>`)}<div class="v2-footer">ATHLETIQ Community · Version locale</div>`}
function challengeStep(id,delta){const x=state.community.challenges.find(c=>c.id===id);if(!x)return;x.progress=Math.max(0,Math.min(Number(x.target)||1,(Number(x.progress)||0)+delta));save()}
async function shareText(text){if(navigator.share){try{await navigator.share({text});return}catch(e){if(e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text);alert('Texte copié !')}catch{prompt('Copie ce texte :',text)}}
function shareApp(){shareText('Découvre ATHLETIQ, mon application fitness : '+location.href)}
function shareSummary(){const c=state.community||{};shareText('ATHLETIQ · '+(c.nickname||'Athlète')+'\nSéances : '+state.workouts.length+'\nDistance : '+fmt(state.activities.reduce((a,x)=>a+(Number(x.km)||0),0))+' km\n'+location.href)}
const tabs=[['home','Accueil'],['sport','Sport'],['nutrition','Nutrition'],['health','Santé'],['progress','Progrès'],['community','Amis'],['profile','Profil']];function render(){document.getElementById('app').innerHTML=({home,sport,nutrition,health,progress,community,profile}[tab])();document.getElementById('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="go('${id}')"><svg viewBox="0 0 24 24" aria-hidden="true">${icons[id]}</svg>${label}</button>`).join('');document.querySelectorAll('form[data-kind]').forEach(f=>f.addEventListener('submit',submit));let file=document.getElementById('restore');if(file)file.addEventListener('change',importData)}function go(x){tab=x;render();window.scrollTo(0,0)}function submit(e){e.preventDefault();let f=e.currentTarget,kind=f.dataset.kind,raw=Object.fromEntries(new FormData(f));for(let k in raw)if(!['name','exercise','type','date'].includes(k))raw[k]=Number(raw[k]);if(kind==='profile'){state.profile=raw}else if(kind==='nickname'){state.community.nickname=String(raw.nickname||'').trim().slice(0,32)}else if(kind==='friend'){const name=String(raw.name||'').trim().slice(0,50);if(name)state.community.friends.push({id:Date.now(),name})}else if(kind==='challenge'){const title=String(raw.name||'').trim().slice(0,80);if(title)state.community.challenges.push({id:Date.now(),name:title,target:Math.max(1,Number(raw.target)||1),progress:0,created:today()})}else{let mapping={workout:'workouts',activity:'activities',meal:'meals',sleep:'sleep',weight:'weights'};state[mapping[kind]].push({...raw,date:raw.date||today(),id:Date.now()})}save()}function addWater(ml){state.water.push({ml,date:today(),id:Date.now()});save()}function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='athletiq-sauvegarde-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(e){let f=e.target.files?.[0];if(!f)return;try{let v=JSON.parse(await f.text());if(!v.profile||!Array.isArray(v.workouts)||!Array.isArray(v.meals)||!Array.isArray(v.sleep)||!Array.isArray(v.weights)||!Array.isArray(v.water)||!Array.isArray(v.activities))throw Error('Format incorrect');if(confirm('Remplacer toutes les données actuelles par cette sauvegarde ?')){state=v;state.community=state.community||{nickname:'',friends:[],challenges:[]};save()}}catch{alert('Sauvegarde invalide.')}}function resetData(){if(confirm('Effacer définitivement toutes les données locales ?')){state=structuredClone(initial);save()}}render();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
